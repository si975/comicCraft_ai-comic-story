<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>ComicCraft</title></head>
<body>
<h1>ComicCraft</h1>
<form action="/generate" method="post">
<label>Story Prompt</label><input name="story_prompt" required><br>
<label>Character Name</label><input name="character_name" required><br>
<label>Setting</label><input name="setting" required><br>
<label>Story Tone</label><input name="tone" required><br>
<label>Art Style</label><input name="art_style" required><br>
<button type="submit">Generate Comic</button>
</form>
</body>
</html>
